services:
  # Tempo runs as user 10001, and docker compose creates the volume as root.
  # As such, we need to chown the volume in order for Tempo to start correctly.
  tempo-chown:
    image: busybox@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
    user: root
    entrypoint:
      - "chown"
      - "10001:10001"
      - "/var/tempo"
    volumes:
      - tempo-data:/var/tempo

  memcached:
    image: memcached@sha256:2046d6d2eb7cbd59470b533a101cbd67def3e718b04eb72478306dbc804a3171
    restart: unless-stopped

  tempo:
    image: grafana/tempo:latest@sha256:1ce31d6d7ffab62189685e8c47881d4a561c5d38bd0dbd66e40ca83cef07923d
    depends_on:
      - tempo-chown
      - memcached
    command:
      - "-config.file=/etc/tempo.yaml"
    volumes:
      - tempo-data:/var/tempo
      - ./tempo.yaml:/etc/tempo.yaml:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command:
      - --config.file=/etc/prometheus.yaml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
      - --enable-feature=native-histograms
    volumes:
      - ./prometheus.yaml:/etc/prometheus.yaml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  renderer:
    build:
      context: ../../../
      dockerfile: Dockerfile
    cap_add:
      - CAP_SYS_ADMIN # for clone, mount, unmount, unshare,
      - CAP_SYS_CHROOT # for chroot
    environment:
      TRACING_ENDPOINT: http://tempo:4318/v1/traces
      LOG_LEVEL: debug
      AUTH_TOKEN: one,two,three,four,five
    command:
      - server
      # 1 GiB
      - --rate-limit.max-available=1073741824
      - --browser.namespaced
    ports:
      - 8081:8081
    depends_on:
      - tempo
      - prometheus

  alloy:
    image: grafana/alloy:latest@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    privileged: true
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/:/var/lib/docker/:ro
    depends_on:
      - loki
    restart: unless-stopped

  loki:
    image: grafana/loki:latest@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    command:
      - -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki.yaml:/etc/loki/local-config.yaml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana-enterprise:nightly@sha256:184dfb3137aab22c3fdfbd60e622ba4f71ed56ad059c813b15d018ccd59102e1
    ports:
      - 3000:3000
    environment:
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_RENDERING_RENDERER_TOKEN: three
      GF_TRACING_OPENTELEMETRY_OTLP_ADDRESS: tempo:4317
      GF_INSTALL_PLUGINS: https://storage.googleapis.com/integration-artifacts/grafana-exploretraces-app/grafana-exploretraces-app-latest.zip;grafana-traces-app
      GF_LOG_FILTERS: rendering:debug
      GF_FEATURE_TOGGLES_ENABLE: sharingDashboardImage,renderAuthJWT
    volumes:
      - grafana-data:/var/lib/grafana
      - ./datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./dashboards:/usr/share/grafana/dashboards:ro
    restart: unless-stopped

volumes:
  grafana-data:
  prometheus-data:
  tempo-data:
  alloy-data:
