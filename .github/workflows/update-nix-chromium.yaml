name: Update Nix Chromium

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency: update-nix-chromium

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Update the Nixpkgs pin when Chromium is ready
        id: update
        shell: bash
        run: |
          set -euo pipefail

          # Use the same rollout threshold as the Nixpkgs Chromium updater.
          latest=$(curl --fail --silent --show-error --retry 3 --max-time 30 --get \
            --data-urlencode 'order_by=version desc' \
            --data-urlencode 'filter=endtime=none,fraction>=0.5' \
            https://versionhistory.googleapis.com/v1/chrome/platforms/linux/channels/stable/versions/all/releases \
            | jq -er '.releases[0].version | select(test("^[0-9]+(\\.[0-9]+){3}$"))')

          nixpkgs=$(jq -er '.nodes.nixpkgs.original | select(.type == "github") | "github:\(.owner)/\(.repo)"' flake.lock)
          channel=$(jq -er '.nodes.nixpkgs.original.ref' flake.lock)

          chromium_versions() {
            nix eval --json "$1#legacyPackages" --apply \
              'pkgs: [ pkgs.x86_64-linux.chromium.browser.version pkgs.aarch64-linux.chromium.browser.version ]'
          }

          locked_rev() {
            jq -er '.nodes.nixpkgs.locked.rev' flake.lock
          }

          expected=$(jq -cn --arg version "$latest" '[$version, $version]')
          current=$(chromium_versions "$nixpkgs/$(locked_rev)")
          newest_pinned=$(jq -r '.[]' <<< "$current" | sort -V | tail -n 1)
          if [[ "$current" == "$expected" ]] || \
            [[ $(printf '%s\n' "$latest" "$newest_pinned" | sort -V | tail -n 1) != "$latest" ]]; then
            printf 'Linux stable is %s. The current pin has %s (amd64, arm64).\n' "$latest" "$current"
            exit 0
          fi

          available=$(chromium_versions "$nixpkgs/$channel")
          if [[ "$available" != "$expected" ]]; then
            printf 'Waiting for Chromium %s on both architectures. %s has %s (amd64, arm64).\n' \
              "$latest" "$channel" "$available"
            exit 0
          fi

          nix flake update nixpkgs
          updated=$(chromium_versions "$nixpkgs/$(locked_rev)")
          if [[ "$updated" != "$expected" ]]; then
            printf 'The updated pin has %s (amd64, arm64). Expected %s.\n' "$updated" "$expected" >&2
            exit 1
          fi

          printf 'version=%s\n' "$latest" >> "$GITHUB_OUTPUT"

      - name: Open or update the pull request
        if: steps.update.outputs.version != ''
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: automation/nix-chromium
          add-paths: flake.lock
          commit-message: Update Nixpkgs for Chromium ${{ steps.update.outputs.version }}
          title: Update Nixpkgs for Chromium ${{ steps.update.outputs.version }}
          body: |
            The updated Nixpkgs pin provides Chromium ${{ steps.update.outputs.version }} on Linux amd64 and arm64.
