name: Docker Tests

on:
  workflow_call:

permissions: {}

jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        variant: [default, nix]
        include:
          - arch: amd64
            runs-on: ubuntu-x64-xlarge
          - arch: arm64
            runs-on: ubuntu-arm64-xlarge

    name: acceptance tests (${{ matrix.arch }}, ${{ matrix.variant }})
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read # clone the repository
      id-token: write # required to read secrets
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: docker build
        if: matrix.variant == 'default'
        env:
          DOCKER_BUILDKIT: 1
          BUILDKIT_STEP_LOG_MAX_SIZE: -1
          BUILDKIT_STEP_LOG_MAX_SPEED: -1
        run: docker build . -t image-renderer

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        if: matrix.variant == 'nix'

      - name: Load Nix image for acceptance
        if: matrix.variant == 'nix'
        run: |
          nix build .#image --no-update-lock-file --out-link "$RUNNER_TEMP/image.tar.gz"
          docker load --input "$RUNNER_TEMP/image.tar.gz"
          docker tag grafana-image-renderer:nix image-renderer
          version=$(nix eval --raw .#browser.version)
          echo "EXPECTED_CHROMIUM_VERSION=$version" >> "$GITHUB_ENV"

      - name: Read license
        if: ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) || (github.event_name == 'push' && github.repository == 'grafana/grafana-image-renderer'))
        id: license_secret
        uses: grafana/shared-workflows/actions/get-vault-secrets@a37de51f3d713a30a9e4b21bcdfbd38170020593 # get-vault-secrets/v1
        with:
          export_env: false
          repo_secrets: |
            LICENSE_JWT=grafana-enterprise-license:license-jwt
      - name: Write license to file system
        if: ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) || (github.event_name == 'push' && github.repository == 'grafana/grafana-image-renderer'))
        env:
          # Step env is evaluated before if, even when Vault is skipped for forks.
          SECRET: ${{ fromJson(steps.license_secret.outputs.secrets || '{}').LICENSE_JWT }}
        run: |
          set -euo pipefail
          LPATH="$(mktemp --tmpdir XXXXXXXXXXXX.jwt)"
          echo "$SECRET" > "$LPATH"
          echo "LICENSE_JWT=$LPATH" >> "$GITHUB_ENV"

      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl kernel.unprivileged_userns_clone=1
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
      - name: go test ./tests/acceptance/...
        run: go test ./tests/acceptance/... -count=1
        env:
          TERM: linux
          IMAGE: image-renderer
          UPDATE_FIXTURES: 'true' # this will make changes, so we can see them
          REQUIRE_ACCEPTANCE: 'true' # fail if no image can be found
          REQUIRE_ENTERPRISE: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) || (github.event_name == 'push' && github.repository == 'grafana/grafana-image-renderer')) }}

      - name: Upload tested Nix image
        if: matrix.variant == 'nix' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) || (github.event_name == 'push' && github.repository == 'grafana/grafana-image-renderer'))
        uses: actions/upload-artifact@v5
        with:
          name: nix-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Tar changed files
        if: failure()
        id: tar
        run: |
          set -euo pipefail
          readarray -t files < <(git diff --name-only)
          if [ "${#files[@]}" -gt "0" ]; then
            tar cJf changed-files.tar.xz "${files[@]}"
            echo 'upload=true' >> "$GITHUB_OUTPUT"
          else
            echo "No files changed :)"
          fi
      - name: Upload changed files
        if: ${{ steps.tar.outputs.upload == 'true' && (success() || failure()) }}
        uses: actions/upload-artifact@v4
        with:
          name: changed-files-${{ matrix.runs-on }}-${{ matrix.variant }}
          path: changed-files.tar.xz
